name: Validate Pull Request

on:
  pull_request:
    branches: [uat, main]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint, Format & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run prettier:verify

      - name: Lint LWC & Aura (ESLint)
        run: npm run lint -- --no-error-on-unmatched-pattern

      - name: Run LWC Jest tests
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwc-coverage
          path: coverage/
          retention-days: 5

  code-analysis:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer plugin (v5)
        run: sf plugins install code-analyzer

      - name: Run Code Analyzer
        id: scanner
        run: |
          mkdir -p results
          set +e
          sf code-analyzer run \
            --workspace "force-app" \
            --rule-selector "SalesforceApexRules" \
            --config-file "code-analyzer.yml" \
            --output-file results/scanner-report.json \
            --output-file results/scanner-report.html \
            --severity-threshold 2
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Report via job summary + PR comment + artifact.
      # Deliberately NOT using the Security tab (SARIF upload), which requires
      # GitHub Advanced Security on private repos.
      - name: Write findings to job summary
        if: always()
        run: |
          {
            echo "## Salesforce Code Analyzer Report"
            echo ""
            if [ -f results/scanner-report.json ]; then
              TOTAL=$(jq '(.violations // []) | length' results/scanner-report.json)
              echo "**Total violations:** ${TOTAL}"
              echo ""
              if [ "$TOTAL" -gt 0 ]; then
                echo "| Rule | Severity | Location | Message |"
                echo "|------|----------|----------|---------|"
                jq -r '
                  (.violations // [])[:30][] |
                  "| " + (.rule // "?") +
                  " | " + ((.severity // "?") | tostring) +
                  " | " + ((.locations[(.primaryLocationIndex // 0)].file // "?") | sub(".*force-app/"; "force-app/")) +
                  ":" + ((.locations[(.primaryLocationIndex // 0)].startLine // 0) | tostring) +
                  " | " + ((.message // "") | gsub("[\n|]"; " ") | .[0:120]) + " |"
                ' results/scanner-report.json
                echo ""
                echo "_Severity: 1=Critical, 2=High, 3=Moderate, 4=Low, 5=Info. Showing first 30; full report in the 'code-analyzer-report' artifact._"
              fi
            else
              echo "No report generated — the analyzer run itself may have errored. Check the step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post findings as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Code Analyzer Report\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('results/scanner-report.json', 'utf8'));
              const violations = report.violations || [];
              const blocking = violations.filter(v => (v.severity || 5) <= 2).length;
              body += `**Total violations:** ${violations.length} (${blocking} blocking at severity ≤ 2)\n\n`;
              if (violations.length > 0) {
                body += '| Rule | Sev | Location | Message |\n|------|-----|----------|--------|\n';
                for (const v of violations.slice(0, 25)) {
                  const loc = (v.locations || [])[v.primaryLocationIndex || 0] || {};
                  const file = (loc.file || '?').replace(/.*force-app\//, 'force-app/');
                  const msg = (v.message || '').replace(/[\n|]/g, ' ').slice(0, 120);
                  body += `| ${v.rule || '?'} | ${v.severity ?? '?'} | ${file}:${loc.startLine || 0} | ${msg} |\n`;
                }
                if (violations.length > 25) {
                  body += `\n_…and ${violations.length - 25} more. Full report in the workflow run's 'code-analyzer-report' artifact._\n`;
                }
              } else {
                body += '✅ No violations found.\n';
              }
            } catch (e) {
              body += '⚠️ Could not read the analyzer report — the run may have errored. Check the workflow logs.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Code Analyzer Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Upload Code Analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-report
          path: results/
          retention-days: 5

      - name: Fail if severity threshold exceeded
        if: steps.scanner.outputs.exit_code != '0'
        run: |
          echo "::error::Code Analyzer found findings at or above severity 2 (High), or the run errored. See the job summary, PR comment, or 'code-analyzer-report' artifact."
          exit 1

  validate-deploy:
    name: Validate Deployment & Apex Tests
    runs-on: ubuntu-latest
    needs: [lint-and-test, code-analysis]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Determine target org
        id: org-config
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "org_alias=prod" >> "$GITHUB_OUTPUT"
            echo "auth_secret=PROD_SF_AUTH_URL" >> "$GITHUB_OUTPUT"
          else
            echo "org_alias=uat" >> "$GITHUB_OUTPUT"
            echo "auth_secret=UAT_SF_AUTH_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to target org
        env:
          SF_AUTH_URL: ${{ github.base_ref == 'main' && secrets.PROD_SF_AUTH_URL || secrets.UAT_SF_AUTH_URL }}
        run: |
          echo "${SF_AUTH_URL}" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias ${{ steps.org-config.outputs.org_alias }} --set-default
          rm -f /tmp/sfdx-auth-url.txt

      - name: Generate delta package (changed metadata only)
        run: |
          mkdir -p delta
          # Use the merge base so commits on the target branch that are not yet
          # in this PR branch are not mis-detected as changes/deletions.
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "Delta range: ${BASE_SHA}..HEAD"
          sf sgd source delta \
            --from "$BASE_SHA" \
            --to "HEAD" \
            --output "delta" \
            --generate-delta

      - name: Check for deployable changes
        id: delta-check
        run: |
          # sfdx-git-delta always writes a package.xml, even when empty — so
          # check for actual <types> content, not just file existence. A PR is
          # deployable if it has metadata changes OR destructive changes.
          HAS_TYPES=false
          HAS_DESTRUCTIVE=false
          if [ -f "delta/package/package.xml" ] && grep -q "<types>" "delta/package/package.xml"; then
            HAS_TYPES=true
          fi
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            HAS_DESTRUCTIVE=true
          fi
          if [ "$HAS_TYPES" = "true" ] || [ "$HAS_DESTRUCTIVE" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deployable metadata changes detected in this PR."
          fi

      - name: Post no-changes comment
        if: steps.delta-check.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Deployment Validation Summary'));
            const body = '## Deployment Validation Summary\n\nNo Salesforce metadata changes detected in this PR — deployment validation skipped.';
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Check for destructive changes
        id: destructive-check
        run: |
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
            echo "::warning::This PR contains destructive changes (metadata deletions)."
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect test classes for changed Apex
        id: test-classes
        if: steps.delta-check.outputs.has_changes == 'true'
        run: |
          # Find changed production Apex (classes AND triggers), excluding test
          # classes and @IsTest utilities (e.g. TestDataFactory).
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'force-app/**/*.cls' 'force-app/**/*.trigger' | \
            grep -v 'Test\.' | grep -v '_Test\.' | \
            while IFS= read -r f; do
              grep -qiE '@IsTest' "$f" 2>/dev/null || echo "$f"
            done | \
            sed 's|.*/||' | sed -E 's/\.(cls|trigger)$//' | xargs)

          echo "changed_apex=$CHANGED" >> "$GITHUB_OUTPUT"

          # PR contains no Apex: validate without any test level. Salesforce
          # runs no tests for a package without Apex (including production
          # validations), so no coverage data is produced or displayed.
          if [ -z "$CHANGED" ]; then
            echo "has_apex=false" >> "$GITHUB_OUTPUT"
            echo "test_level=" >> "$GITHUB_OUTPUT"
            echo "tests=" >> "$GITHUB_OUTPUT"
            echo "No Apex classes or triggers changed — skipping test execution."
            exit 0
          fi
          echo "has_apex=true" >> "$GITHUB_OUTPUT"

          TEST_NAMES=""
          for CLS in $CHANGED; do
            # Look for a matching test class in the repo
            FOUND=$(find force-app -name "${CLS}Test.cls" -o -name "${CLS}_Test.cls" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              TEST_NAME=$(basename "$FOUND" .cls)
              TEST_NAMES="${TEST_NAMES} ${TEST_NAME}"
            fi
          done

          TEST_NAMES=$(echo "$TEST_NAMES" | xargs)  # trim whitespace

          if [ -n "$TEST_NAMES" ]; then
            echo "test_level=RunSpecifiedTests" >> "$GITHUB_OUTPUT"
            echo "tests=$TEST_NAMES" >> "$GITHUB_OUTPUT"
            echo "Using RunSpecifiedTests: $TEST_NAMES"
          else
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
            echo "tests=" >> "$GITHUB_OUTPUT"
            echo "Apex changed but no matching test classes found — falling back to RunLocalTests"
          fi

      - name: Validate deployment (dry-run)
        id: validate
        if: steps.delta-check.outputs.has_changes == 'true'
        run: |
          TEST_LEVEL="${{ steps.test-classes.outputs.test_level }}"
          TESTS="${{ steps.test-classes.outputs.tests }}"

          DEPLOY_CMD="sf project deploy start \
            --manifest delta/package/package.xml \
            --dry-run \
            --wait 30 \
            --json"

          # Only pass --test-level when the PR actually contains Apex. Without
          # Apex in the package, the platform runs no tests and produces no
          # coverage data (so none is shown in the PR comment).
          if [ -n "$TEST_LEVEL" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --test-level ${TEST_LEVEL}"
          fi

          if [ "$TEST_LEVEL" == "RunSpecifiedTests" ] && [ -n "$TESTS" ]; then
            # Build --tests flags for each test class
            for T in $TESTS; do
              DEPLOY_CMD="$DEPLOY_CMD --tests $T"
            done
          fi

          if [ "${{ steps.destructive-check.outputs.has_destructive }}" == "true" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml"
          fi

          set +e
          set -o pipefail
          eval $DEPLOY_CMD | tee deploy-result.json
          DEPLOY_EXIT=$?
          set -e
          echo "deploy_exit_code=$DEPLOY_EXIT" >> "$GITHUB_OUTPUT"

          # Gate the job on the actual validation result. Without this check a
          # failed dry-run (e.g. on config-only PRs with no Apex changes) would
          # let the PR check pass green.
          STATUS=$(jq -r '.status // 1' deploy-result.json 2>/dev/null || echo 1)
          if [ "$STATUS" != "0" ]; then
            echo "::error::Deployment validation failed. Component failures (if any):"
            jq '.result.details.componentFailures // empty' deploy-result.json 2>/dev/null || true
            exit 1
          fi

      - name: Check per-class coverage for changed Apex classes (80% minimum)
        if: steps.delta-check.outputs.has_changes == 'true' && steps.test-classes.outputs.has_apex == 'true'
        run: |
          # Reuse the changed Apex list (classes + triggers) computed earlier.
          CHANGED_CLASSES="${{ steps.test-classes.outputs.changed_apex }}"

          if [ -z "$CHANGED_CLASSES" ]; then
            echo "No non-test Apex classes or triggers changed in this PR."
            exit 0
          fi

          echo "Changed Apex classes: $CHANGED_CLASSES"
          FAILED=false

          if [ -f "deploy-result.json" ]; then
            for CLASS in $CHANGED_CLASSES; do
              CLASS_COV=$(jq -r --arg cls "$CLASS" '
                .result.details.runTestResult.codeCoverage[]? |
                select(.name == $cls) |
                (if (.numLocations // 0) == 0 then 100
                 else (((.numLocations - .numLocationsNotCovered) / .numLocations) * 100)
                 end)
              ' deploy-result.json 2>/dev/null)

              if [ -z "$CLASS_COV" ] || [ "$CLASS_COV" == "null" ]; then
                echo "::error::Class '$CLASS' has no test coverage data. Ensure a test class covers it."
                FAILED=true
              elif (( $(echo "$CLASS_COV < 80" | bc -l) )); then
                echo "::error::Class '$CLASS' has ${CLASS_COV}% coverage (minimum 80% required)"
                FAILED=true
              else
                echo "✓ $CLASS: ${CLASS_COV}%"
              fi
            done
          else
            echo "::error::No deploy result found to check coverage."
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "::error::One or more Apex classes do not meet the 80% per-class coverage requirement."
            exit 1
          fi

      - name: Post deploy summary as PR comment
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## Deployment Validation Summary\n\n';

            try {
              const result = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
              const status = result.status === 0 ? '✅ Passed' : '❌ Failed';
              summary += `**Status:** ${status}\n\n`;

              if (result.result) {
                const r = result.result;
                summary += `| Metric | Value |\n|--------|-------|\n`;
                summary += `| Components Deployed | ${r.numberComponentsDeployed || 0} |\n`;
                summary += `| Component Errors | ${r.numberComponentErrors || 0} |\n`;

                if (r.numberTestsCompleted > 0) {
                  summary += `| Tests Run | ${r.numberTestsCompleted} |\n`;
                  summary += `| Test Failures | ${r.numberTestErrors || 0} |\n`;
                }
                summary += '\n';
              }
            } catch (e) {
              summary += '⚠️ Could not parse deployment result.\n\n';
            }

            try {
              // Only show coverage for Apex actually changed in this PR.
              // A PR without Apex changes shows no coverage table at all.
              const changedApex = '${{ steps.test-classes.outputs.changed_apex }}'
                .split(/\s+/)
                .filter(Boolean);
              const result = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
              const coverage = result?.result?.details?.runTestResult?.codeCoverage;
              if (changedApex.length > 0 && coverage && coverage.length > 0) {
                const rows = coverage.filter(c => changedApex.includes(c.name));
                if (rows.length > 0) {
                  summary += `\n| Class | Coverage | Status |\n|-------|----------|--------|\n`;
                  for (const c of rows) {
                    const locs = c.numLocations || 0;
                    const pct = locs === 0 ? 100 : Math.round(((locs - (c.numLocationsNotCovered || 0)) / locs) * 100);
                    const icon = pct >= 80 ? '✅' : '❌';
                    summary += `| ${c.name} | ${pct}% | ${icon} (min 80%) |\n`;
                  }
                }
              }
            } catch (e) { /* coverage data unavailable */ }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Deployment Validation Summary'));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

      - name: Upload deploy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-results
          path: deploy-result.json
          retention-days: 5
