name: Validate Pull Request

on:
  pull_request:
    branches: [uat, main]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint, Format & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run prettier:verify

      - name: Lint LWC & Aura (ESLint)
        run: npm run lint -- --no-error-on-unmatched-pattern

      - name: Run LWC Jest tests
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwc-coverage
          path: coverage/
          retention-days: 5

  code-analysis:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Create results directory
        run: mkdir -p results

      - name: Run Code Analyzer
        id: scanner
        run: |
          sf scanner run \
            --target "force-app" \
            --pmdconfig "config/pmd-ruleset.xml" \
            --format sarif \
            --outfile results/scanner-report.sarif \
            --severity-threshold 2 || echo "scanner_failed=true" >> "$GITHUB_OUTPUT"

      - name: Fail if scanner found critical issues
        if: steps.scanner.outputs.scanner_failed == 'true'
        run: |
          echo "::error::Code Analyzer found High or Critical severity findings. Check the Security tab for details."
          exit 1

  validate-deploy:
    name: Validate Deployment & Apex Tests
    runs-on: ubuntu-latest
    needs: [lint-and-test, code-analysis]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Determine target org
        id: org-config
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "org_alias=prod" >> "$GITHUB_OUTPUT"
            echo "auth_secret=PROD_SF_AUTH_URL" >> "$GITHUB_OUTPUT"
          else
            echo "org_alias=uat" >> "$GITHUB_OUTPUT"
            echo "auth_secret=UAT_SF_AUTH_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to target org
        env:
          SF_AUTH_URL: ${{ github.base_ref == 'main' && secrets.PROD_SF_AUTH_URL || secrets.UAT_SF_AUTH_URL }}
        run: |
          echo "${SF_AUTH_URL}" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias ${{ steps.org-config.outputs.org_alias }} --set-default
          rm -f /tmp/sfdx-auth-url.txt

      - name: Generate delta package (changed metadata only)
        run: |
          mkdir -p delta
          sf sgd source delta \
            --from "origin/${{ github.base_ref }}" \
            --to "HEAD" \
            --output "delta" \
            --generate-delta

      - name: Check for deployable changes
        id: delta-check
        run: |
          if [ -f "delta/package/package.xml" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No metadata changes detected in this PR."
          fi

      - name: Post no-changes comment
        if: steps.delta-check.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Deployment Validation Summary'));
            const body = '## Deployment Validation Summary\n\nNo Salesforce metadata changes detected in this PR — deployment validation skipped.';
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Check for destructive changes
        id: destructive-check
        run: |
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ]; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
            echo "::warning::This PR contains destructive changes (metadata deletions)."
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect test classes for changed Apex
        id: test-classes
        if: steps.delta-check.outputs.has_changes == 'true'
        run: |
          # Find *Test.cls files that correspond to changed production classes
          # Exclude @IsTest classes (e.g. TestDataFactory) by scanning file contents
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'force-app/**/*.cls' | \
            grep -v 'Test\.' | grep -v '_Test\.' | \
            while IFS= read -r f; do
              grep -qiE '@IsTest' "$f" 2>/dev/null || echo "$f"
            done | \
            sed 's|.*/||' | sed 's|\.cls||')

          TEST_NAMES=""
          for CLS in $CHANGED; do
            # Look for a matching test class in the repo
            FOUND=$(find force-app -name "${CLS}Test.cls" -o -name "${CLS}_Test.cls" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              TEST_NAME=$(basename "$FOUND" .cls)
              TEST_NAMES="${TEST_NAMES} ${TEST_NAME}"
            fi
          done

          TEST_NAMES=$(echo "$TEST_NAMES" | xargs)  # trim whitespace

          if [ -n "$TEST_NAMES" ]; then
            echo "test_level=RunSpecifiedTests" >> "$GITHUB_OUTPUT"
            echo "tests=$TEST_NAMES" >> "$GITHUB_OUTPUT"
            echo "Using RunSpecifiedTests: $TEST_NAMES"
          else
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
            echo "tests=" >> "$GITHUB_OUTPUT"
            echo "No matching test classes found — falling back to RunLocalTests"
          fi

      - name: Validate deployment (dry-run)
        id: validate
        if: steps.delta-check.outputs.has_changes == 'true'
        run: |
          TEST_LEVEL="${{ steps.test-classes.outputs.test_level }}"
          TESTS="${{ steps.test-classes.outputs.tests }}"

          DEPLOY_CMD="sf project deploy start \
            --manifest delta/package/package.xml \
            --dry-run \
            --test-level ${TEST_LEVEL} \
            --wait 30 \
            --json"

          if [ "$TEST_LEVEL" == "RunSpecifiedTests" ] && [ -n "$TESTS" ]; then
            # Build --tests flags for each test class
            for T in $TESTS; do
              DEPLOY_CMD="$DEPLOY_CMD --tests $T"
            done
          fi

          if [ "${{ steps.destructive-check.outputs.has_destructive }}" == "true" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml"
          fi

          set +e
          eval $DEPLOY_CMD | tee deploy-result.json
          echo "deploy_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check per-class coverage for changed Apex classes (80% minimum)
        if: steps.delta-check.outputs.has_changes == 'true'
        run: |
          # Get list of changed production Apex classes (exclude test classes and @IsTest utilities)
          CHANGED_CLASSES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'force-app/**/*.cls' | \
            grep -v 'Test\.' | grep -v '_Test\.' | grep -v 'test\.' | \
            while IFS= read -r f; do
              grep -qiE '@IsTest' "$f" 2>/dev/null || echo "$f"
            done | \
            sed 's|.*/||' | sed 's|\.cls||')

          if [ -z "$CHANGED_CLASSES" ]; then
            echo "No non-test Apex classes changed in this PR."
            exit 0
          fi

          echo "Changed Apex classes: $CHANGED_CLASSES"
          FAILED=false

          if [ -f "deploy-result.json" ]; then
            for CLASS in $CHANGED_CLASSES; do
              CLASS_COV=$(jq -r --arg cls "$CLASS" '
                .result.details.runTestResult.codeCoverage[]? |
                select(.name == $cls) |
                (if (.numLocations // 0) == 0 then 100
                 else (((.numLocations - .numLocationsNotCovered) / .numLocations) * 100)
                 end)
              ' deploy-result.json 2>/dev/null)

              if [ -z "$CLASS_COV" ] || [ "$CLASS_COV" == "null" ]; then
                echo "::error::Class '$CLASS' has no test coverage data. Ensure a test class covers it."
                FAILED=true
              elif (( $(echo "$CLASS_COV < 80" | bc -l) )); then
                echo "::error::Class '$CLASS' has ${CLASS_COV}% coverage (minimum 80% required)"
                FAILED=true
              else
                echo "✓ $CLASS: ${CLASS_COV}%"
              fi
            done
          else
            echo "::error::No deploy result found to check coverage."
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "::error::One or more Apex classes do not meet the 80% per-class coverage requirement."
            exit 1
          fi

      - name: Post deploy summary as PR comment
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## Deployment Validation Summary\n\n';

            try {
              const result = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
              const status = result.status === 0 ? '✅ Passed' : '❌ Failed';
              summary += `**Status:** ${status}\n\n`;

              if (result.result) {
                const r = result.result;
                summary += `| Metric | Value |\n|--------|-------|\n`;
                summary += `| Components Deployed | ${r.numberComponentsDeployed || 0} |\n`;
                summary += `| Component Errors | ${r.numberComponentErrors || 0} |\n`;

                if (r.numberTestsCompleted > 0) {
                  summary += `| Tests Run | ${r.numberTestsCompleted} |\n`;
                  summary += `| Test Failures | ${r.numberTestErrors || 0} |\n`;
                }
                summary += '\n';
              }
            } catch (e) {
              summary += '⚠️ Could not parse deployment result.\n\n';
            }

            try {
              const result = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
              const coverage = result?.result?.details?.runTestResult?.codeCoverage;
              if (coverage && coverage.length > 0) {
                summary += `\n| Class | Coverage | Status |\n|-------|----------|--------|\n`;
                for (const c of coverage) {
                  if (!c.name.endsWith('Test')) {
                    const locs = c.numLocations || 0;
                    const pct = locs === 0 ? 100 : Math.round(((locs - (c.numLocationsNotCovered || 0)) / locs) * 100);
                    const icon = pct >= 80 ? '✅' : '❌';
                    summary += `| ${c.name} | ${pct}% | ${icon} (min 80%) |\n`;
                  }
                }
              }
            } catch (e) { /* coverage data unavailable */ }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Deployment Validation Summary'));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

      - name: Upload deploy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-results
          path: deploy-result.json
          retention-days: 5
