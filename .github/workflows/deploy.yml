name: Deploy to Org

on:
  push:
    branches: [uat, main]
    paths:
      - "force-app/**"
      - "destructiveChanges/**"

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Metadata
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'uat' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install sfdx-git-delta plugin
        if: github.ref_name != 'main'
        run: echo y | sf plugins install sfdx-git-delta

      - name: Determine target org
        id: org-config
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "org_alias=prod" >> "$GITHUB_OUTPUT"
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "org_alias=uat" >> "$GITHUB_OUTPUT"
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=delta" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to target org
        env:
          SF_AUTH_URL: ${{ github.ref_name == 'main' && secrets.PROD_SF_AUTH_URL || secrets.UAT_SF_AUTH_URL }}
        run: |
          echo "${SF_AUTH_URL}" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias ${{ steps.org-config.outputs.org_alias }} --set-default
          rm -f /tmp/sfdx-auth-url.txt

      # --- Delta deployment (UAT only) ---
      - name: Generate delta package
        if: steps.org-config.outputs.deploy_mode == 'delta'
        run: |
          mkdir -p delta
          # Diff against the commit the branch pointed at before this push, so
          # multi-commit pushes and merge commits are fully captured (HEAD~1
          # would miss all but the last commit).
          FROM_SHA="${{ github.event.before }}"
          if [ -z "$FROM_SHA" ] || \
             [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${FROM_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Push base SHA unavailable; falling back to HEAD~1."
            FROM_SHA="HEAD~1"
          fi
          echo "Delta range: ${FROM_SHA}..HEAD"
          sf sgd source delta \
            --from "$FROM_SHA" \
            --to "HEAD" \
            --output "delta" \
            --generate-delta

      - name: Check for delta changes
        if: steps.org-config.outputs.deploy_mode == 'delta'
        id: delta-check
        run: |
          # sfdx-git-delta always writes a package.xml, even when empty — check
          # for actual <types> content. Destructive-only pushes still deploy.
          HAS_TYPES=false
          HAS_DESTRUCTIVE=false
          if [ -f "delta/package/package.xml" ] && grep -q "<types>" "delta/package/package.xml"; then
            HAS_TYPES=true
          fi
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            HAS_DESTRUCTIVE=true
          fi
          if [ "$HAS_TYPES" = "true" ] || [ "$HAS_DESTRUCTIVE" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No metadata changes to deploy."
          fi

      - name: Check for destructive changes
        if: steps.org-config.outputs.deploy_mode == 'delta'
        id: destructive-check
        run: |
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy delta to UAT
        if: steps.org-config.outputs.deploy_mode == 'delta' && steps.delta-check.outputs.has_changes == 'true'
        run: |
          DEPLOY_CMD="sf project deploy start \
            --manifest delta/package/package.xml \
            --test-level ${{ steps.org-config.outputs.test_level }} \
            --wait 30 \
            --json"

          if [ "${{ steps.destructive-check.outputs.has_destructive }}" == "true" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml"
          fi

          eval $DEPLOY_CMD | tee deploy-result.json

      # --- Full deployment (Prod only) ---
      - name: Deploy full source to Prod
        if: steps.org-config.outputs.deploy_mode == 'full'
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level ${{ steps.org-config.outputs.test_level }} \
            --wait 30 \
            --json | tee deploy-result.json

      # --- Verify ---
      - name: Verify deployment
        id: verify
        run: |
          if [ ! -f "deploy-result.json" ]; then
            echo "::notice::No deployment was executed (no changes detected)."
            exit 0
          fi
          STATUS=$(jq -r '.status' deploy-result.json)
          if [ "$STATUS" != "0" ]; then
            echo "::error::Deployment failed"
            jq '.result.details.componentFailures // empty' deploy-result.json
            exit 1
          fi
          echo "::notice::Deployment successful to ${{ steps.org-config.outputs.org_alias }}"

      - name: Upload deploy results
        if: always() && hashFiles('deploy-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deploy-results-${{ github.ref_name }}-${{ github.run_number }}
          path: deploy-result.json
          retention-days: 10
